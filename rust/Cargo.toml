[package]
name = "unshear"
version = "0.1.0"
edition = "2021"
authors = ["goweft <goweft@proton.me>"]
description = "AI agent fork divergence detector — detects removed safety mechanisms, stripped guardrails, and weakened security controls"
license = "MIT"
repository = "https://github.com/goweft/unshear"
homepage = "https://github.com/goweft/unshear"
keywords = ["security", "ai", "safety", "fork", "audit"]
categories = ["command-line-utilities", "development-tools"]
default-run = "unshear"

[[bin]]
name = "unshear"
path = "src/main.rs"

[dependencies]
# Byte-level regex — matches Python re.compile(rb"...") exactly
regex = "1"
# Unified diff for modified-file analysis — replaces difflib.unified_diff
similar = { version = "2", features = ["text"] }
# ** -aware glob sets for SECURITY_FILE_PATTERNS and IGNORE_PATTERNS
globset = "0.4"
# JSON output + .unshear.json config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI subcommands (compare / audit), matches Python argparse structure
clap = { version = "4", features = ["derive"] }
# Recursive directory traversal — replaces Path.rglob("*")
walkdir = "2"
# Compile-once statics for regex tables
once_cell = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
