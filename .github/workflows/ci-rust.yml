name: CI (Rust)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

  # ── Release — static binaries ────────────────────────────────────────────────
  # Triggered on version tags: v0.2.0, v1.0.0, etc.
  # Produces three artifacts: linux-musl (fully static), darwin-arm64, windows.
  release:
    name: Release ${{ matrix.target }}
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: unshear-linux-x86_64
            install_musl: true

          - os: macos-14          # Apple Silicon runner
            target: aarch64-apple-darwin
            artifact: unshear-darwin-arm64
            install_musl: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: unshear-windows-x86_64.exe
            install_musl: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux only)
        if: matrix.install_musl
        run: sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # Force static CRT on Linux musl
          RUSTFLAGS: ${{ matrix.install_musl && '-C target-feature=+crt-static' || '' }}

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/unshear \
             ${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item target/${{ matrix.target }}/release/unshear.exe `
                    ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rust/${{ matrix.artifact }}
          if-no-files-found: error

  # ── GitHub Release ───────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## unshear ${{ github.ref_name }}

            Static binary release — no runtime dependencies, no Python required.

            | Platform | File |
            |---|---|
            | Linux x86_64 (static) | `unshear-linux-x86_64` |
            | macOS ARM64 | `unshear-darwin-arm64` |
            | Windows x86_64 | `unshear-windows-x86_64.exe` |

            ### Install (Linux)
            ```bash
            curl -fsSL https://github.com/goweft/unshear/releases/latest/download/unshear-linux-x86_64 \
              -o /usr/local/bin/unshear && chmod +x /usr/local/bin/unshear
            ```
