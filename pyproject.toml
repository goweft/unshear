[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "unshear"
version = "0.1.0"
description = "Unshear — AI agent fork divergence detector. Reveals where someone cut the safety weave from a forked codebase."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "goweft", email = "goweft@proton.me" },
]
keywords = [
    "security", "ai", "agent", "fork", "safety", "guardrail",
    "divergence", "mcp", "supply-chain", "scanner",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/goweft/unshear"
Repository = "https://github.com/goweft/unshear"
Issues = "https://github.com/goweft/unshear/issues"

[project.scripts]
unshear = "unshear:main"

[tool.setuptools.packages.find]
where = ["src"]
